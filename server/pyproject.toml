[project]
name = "chess-bot-server"
version = "0.1.0"
description = "Gated site that serves the chess-bot DevTools snippet"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "bcrypt>=4.0",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]
